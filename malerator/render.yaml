services:
  - type: web
    name: django-meal-rator
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn malerator.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true